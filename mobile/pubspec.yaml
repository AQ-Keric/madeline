name: madeline_mobile
description: "J.A.R.V.I.S. Uplink Interface"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  # Dejamos que Flutter elija la versión perfecta sin bugs
  record: any
  path_provider: ^2.1.3
  permission_handler: 11.3.0
  audioplayers: ^6.8.1
  # Guardar capturas en la galería del teléfono
  gal: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: any
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
